name: CI

# A release merges into main, then roam-depot builds that merge commit
# (docs/roam-depot/SUBMISSION.md). Run only on that path: PRs into main,
# and the merge commit itself.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build (same script roam-depot runs)
        run: ./build.sh

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test
